<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- DJI RS5 Combo Gimbal -->
  <g stroke="#c8ff00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Battery grip / handle -->
    <rect x="170" y="160" width="50" height="100" rx="8" />
    <rect x="175" y="170" width="40" height="15" rx="3" stroke-opacity="0.3" />
    <!-- Power button -->
    <circle cx="195" cy="200" r="6" />
    <circle cx="195" cy="200" r="3" fill="#c8ff00" fill-opacity="0.3" />
    <!-- Battery level LEDs -->
    <circle cx="183" cy="220" r="2" fill="#c8ff00" fill-opacity="0.5" />
    <circle cx="191" cy="220" r="2" fill="#c8ff00" fill-opacity="0.4" />
    <circle cx="199" cy="220" r="2" fill="#c8ff00" fill-opacity="0.3" />
    <circle cx="207" cy="220" r="2" fill="#c8ff00" fill-opacity="0.2" />
    <!-- Tilt motor axis -->
    <circle cx="195" cy="145" r="18" />
    <circle cx="195" cy="145" r="12" stroke-opacity="0.4" />
    <circle cx="195" cy="145" r="4" fill="#c8ff00" fill-opacity="0.2" />
    <!-- Tilt arm -->
    <line x1="177" y1="145" x2="130" y2="145" />
    <rect x="110" y="135" width="25" height="20" rx="4" />
    <!-- Camera mounting plate -->
    <rect x="95" y="128" width="55" height="6" rx="2" />
    <!-- Roll motor axis -->
    <circle cx="195" cy="115" r="14" />
    <circle cx="195" cy="115" r="8" stroke-opacity="0.4" />
    <circle cx="195" cy="115" r="3" fill="#c8ff00" fill-opacity="0.2" />
    <!-- Roll arm -->
    <line x1="195" y1="101" x2="195" y2="85" />
    <!-- Pan motor axis -->
    <circle cx="195" cy="75" r="14" />
    <circle cx="195" cy="75" r="8" stroke-opacity="0.4" />
    <circle cx="195" cy="75" r="3" fill="#c8ff00" fill-opacity="0.2" />
    <!-- Focus wheel -->
    <circle cx="235" cy="180" r="10" />
    <circle cx="235" cy="180" r="6" stroke-opacity="0.3" />
    <!-- Mode button -->
    <rect x="230" y="195" width="15" height="8" rx="2" stroke-opacity="0.4" />
    <!-- Status screen -->
    <rect x="175" y="162" width="40" height="12" rx="2" stroke-opacity="0.5" />
  </g>
  <!-- Label -->
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c8ff00" text-anchor="middle" letter-spacing="3">DJI RS 5</text>
  <text x="200" y="294" font-family="system-ui, sans-serif" font-size="9" fill="#666" text-anchor="middle" letter-spacing="2">COMBO</text>
</svg>
