<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Sony FX3 Camera Body -->
  <g stroke="#c8ff00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main body -->
    <rect x="80" y="80" width="220" height="140" rx="8" />
    <!-- Top plate -->
    <rect x="85" y="70" width="190" height="15" rx="3" />
    <!-- Viewfinder bump -->
    <rect x="250" y="60" width="40" height="25" rx="4" />
    <rect x="258" y="63" width="24" height="12" rx="2" />
    <!-- Lens mount -->
    <circle cx="170" cy="150" r="45" />
    <circle cx="170" cy="150" r="38" />
    <circle cx="170" cy="150" r="28" />
    <circle cx="170" cy="150" r="12" fill="#c8ff00" fill-opacity="0.15" />
    <!-- Grip texture -->
    <line x1="90" y1="100" x2="90" y2="210" />
    <line x1="95" y1="100" x2="95" y2="210" />
    <line x1="100" y1="100" x2="100" y2="210" />
    <!-- Top buttons -->
    <circle cx="130" cy="75" r="3" fill="#c8ff00" fill-opacity="0.3" />
    <circle cx="150" cy="75" r="3" fill="#c8ff00" fill-opacity="0.3" />
    <circle cx="170" cy="75" r="3" fill="#c8ff00" fill-opacity="0.3" />
    <!-- Recording indicator -->
    <circle cx="115" cy="75" r="3" fill="#c8ff00" fill-opacity="0.6" />
    <!-- HDMI port -->
    <rect x="300" y="130" width="8" height="20" rx="2" />
    <!-- Screen -->
    <rect x="110" y="175" width="120" height="35" rx="3" stroke-opacity="0.4" />
    <!-- Hot shoe -->
    <rect x="200" y="67" width="30" height="6" rx="1" />
    <!-- XLR handle attachment points -->
    <circle cx="85" cy="90" r="4" />
    <circle cx="295" cy="90" r="4" />
  </g>
  <!-- Label -->
  <text x="200" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c8ff00" text-anchor="middle" letter-spacing="3">SONY FX3</text>
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="9" fill="#666" text-anchor="middle" letter-spacing="2">CINEMA LINE</text>
</svg>
